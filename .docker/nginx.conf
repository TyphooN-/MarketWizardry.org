server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/xml
        text/css
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), accelerometer=(), gyroscope=(), autoplay=(), encrypted-media=(), picture-in-picture=(), clipboard-write=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'self' https://*.youtube.com; worker-src 'none'; form-action 'self'; base-uri 'self'; manifest-src 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;

    error_page 404 /404.html;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* ^/(?:Dockerfile|ansible/|docs/|__pycache__/|.*\.(?:py|pyc|sh|ini|env|example|log|conf|bak|swp|sql|ya?ml|toml)) {
        return 404;
    }

    location = / {
        expires 1h;
        try_files /index.html =404;
    }

    location = /404.html {
        expires 1h;
    }

    location ~* \.(?:css|js|mjs|json|webmanifest|png|jpe?g|gif|webp|svg|ico|pdf)$ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:html|xml|txt|csv|md)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri.html $uri $uri/ =404;
    }
}
