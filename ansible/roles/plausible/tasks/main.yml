---
- name: Install required packages
  apt:
    name:
      - docker.io
      - containerd
      - docker-compose-v2
      - python3-docker
    state: present
    update_cache: true

- name: Ensure containerd service is running
  systemd:
    name: containerd
    state: started
    enabled: true

- name: Ensure docker service is running
  systemd:
    name: docker
    state: started
    enabled: true

- name: Create deploy directory
  file:
    path: "{{ plausible_deploy_dir }}"
    state: directory
    mode: "0750"

- name: Create clickhouse config directory
  file:
    path: "{{ plausible_deploy_dir }}/clickhouse"
    state: directory
    mode: "0750"

- name: Generate secret key base (if not exists)
  shell: openssl rand -base64 48 | tr -d '\n'
  register: generated_secret_key
  args:
    creates: "{{ plausible_deploy_dir }}/.secret_key_base"

- name: Save secret key base
  copy:
    content: "{{ generated_secret_key.stdout }}"
    dest: "{{ plausible_deploy_dir }}/.secret_key_base"
    mode: "0600"
  when: generated_secret_key.changed

- name: Read secret key base
  slurp:
    src: "{{ plausible_deploy_dir }}/.secret_key_base"
  register: secret_key_base

- name: Generate TOTP vault key (if not exists)
  shell: openssl rand -base64 32 | tr -d '\n'
  register: generated_totp_key
  args:
    creates: "{{ plausible_deploy_dir }}/.totp_vault_key"

- name: Save TOTP vault key
  copy:
    content: "{{ generated_totp_key.stdout }}"
    dest: "{{ plausible_deploy_dir }}/.totp_vault_key"
    mode: "0600"
  when: generated_totp_key.changed

- name: Read TOTP vault key
  slurp:
    src: "{{ plausible_deploy_dir }}/.totp_vault_key"
  register: totp_vault_key

- name: Generate postgres password (if not exists)
  shell: openssl rand -hex 16
  register: generated_pg_pass
  args:
    creates: "{{ plausible_deploy_dir }}/.pg_password"

- name: Save postgres password
  copy:
    content: "{{ generated_pg_pass.stdout }}"
    dest: "{{ plausible_deploy_dir }}/.pg_password"
    mode: "0600"
  when: generated_pg_pass.changed

- name: Read postgres password
  slurp:
    src: "{{ plausible_deploy_dir }}/.pg_password"
  register: pg_password

- name: Deploy clickhouse logging config
  template:
    src: clickhouse-config.xml.j2
    dest: "{{ plausible_deploy_dir }}/clickhouse/clickhouse-config.xml"
    mode: "0644"
  notify: restart plausible

- name: Deploy clickhouse user config
  template:
    src: clickhouse-user-config.xml.j2
    dest: "{{ plausible_deploy_dir }}/clickhouse/clickhouse-user-config.xml"
    mode: "0644"
  notify: restart plausible

- name: Deploy plausible env file
  template:
    src: plausible-conf.env.j2
    dest: "{{ plausible_deploy_dir }}/plausible-conf.env"
    mode: "0600"
  notify: restart plausible

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ plausible_deploy_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart plausible

- name: Find Apache .bak backup files from earlier runs
  find:
    paths:
      - /etc/apache2/sites-enabled
      - /etc/apache2/sites-available
    patterns: "*.bak.*"
    use_regex: false
  register: apache_bak_files

- name: Clean up stacked Apache .bak files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apache_bak_files.files }}"

- name: Enable Apache proxy modules
  apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_http
    - headers
  notify: restart apache

- name: Disable obsolete global plausible.conf if present
  command: a2disconf plausible
  args:
    removes: /etc/apache2/conf-enabled/plausible.conf
  notify: restart apache

- name: Remove obsolete global plausible.conf file
  file:
    path: /etc/apache2/conf-available/plausible.conf
    state: absent
  notify: restart apache

- name: Backup default-ssl.conf before injecting Plausible proxy
  copy:
    src: /etc/apache2/sites-available/default-ssl.conf
    dest: /etc/apache2/sites-available/default-ssl.conf.preplausible
    remote_src: true
    force: false

- name: Inject Plausible proxy directives into default-ssl.conf
  blockinfile:
    path: /etc/apache2/sites-available/default-ssl.conf
    insertbefore: "</VirtualHost>"
    marker: "    # {mark} ANSIBLE MANAGED PLAUSIBLE PROXY"
    block: |2
          # Plausible Analytics reverse proxy — same-origin tracking
          ProxyPreserveHost On
          RequestHeader set X-Forwarded-Proto "https"

          # Tracking script served from same origin (unblockable by ad blockers)
          # Serves the enhanced variant with outbound links, file downloads,
          # 404 tracking, and hashed page paths enabled.
          ProxyPass /js/plausible.js http://127.0.0.1:{{ plausible_port }}/js/script.file-downloads.hash.outbound-links.js
          ProxyPassReverse /js/plausible.js http://127.0.0.1:{{ plausible_port }}/js/script.file-downloads.hash.outbound-links.js

          # Plausible event API
          ProxyPass /api/event http://127.0.0.1:{{ plausible_port }}/api/event
          ProxyPassReverse /api/event http://127.0.0.1:{{ plausible_port }}/api/event
  notify: restart apache

- name: Start plausible stack
  community.docker.docker_compose_v2:
    project_src: "{{ plausible_deploy_dir }}"
    state: present

# ----- Credential display (opt-in) -----
# Run with `-e show_credentials=true` to print the generated secrets so they
# can be backed up to a password manager. Skipped by default.
- name: Display Plausible credentials for backup
  debug:
    msg: |
      === PLAUSIBLE CREDENTIALS — STORE IN PASSWORD MANAGER ===
      Host:           {{ inventory_hostname }}
      Deploy dir:     {{ plausible_deploy_dir }}

      SECRET_KEY_BASE:  {{ secret_key_base.content | b64decode }}
      TOTP_VAULT_KEY:   {{ totp_vault_key.content | b64decode }}
      POSTGRES_PASSWORD: {{ pg_password.content | b64decode }}

      These files live on the server at:
        {{ plausible_deploy_dir }}/.secret_key_base
        {{ plausible_deploy_dir }}/.totp_vault_key
        {{ plausible_deploy_dir }}/.pg_password

      WARNING: Back these up now. Losing them means:
        - Existing admin sessions become invalid
        - TOTP 2FA secrets cannot be decrypted
        - PostgreSQL data volume becomes unrecoverable without password
      ============================================================
  no_log: false
  when: show_credentials | default(false) | bool
